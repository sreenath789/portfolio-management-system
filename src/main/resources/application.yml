server:
  port: 8080

spring:
  application:
    name: portfolio-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

jwt:
  secret: 3mY4R6v9Y2Pq8NfT7xLw5KbH1ZaC8EeD9RpU2VmX6QsJ4GhN
  access-token-expiration: 900000      # 15 minutes
  refresh-token-expiration: 604800000